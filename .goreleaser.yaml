version: 2

project_name: rancher-deployer

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: rancher-deployer
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mallardduck/rancher-deployer/internal/version.Version={{.Version}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Commit={{.Commit}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: "New features"
      regexp: '^feat'
    - title: "Bug fixes"
      regexp: '^fix'
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mallardduck
    name: rancher-deployer
  draft: false
  prerelease: auto
