version: 2

project_name: rancher-deployer

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: rancher-deployer
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mallardduck/rancher-deployer/internal/version.Version={{.Version}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Commit={{.Commit}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

dockers_v2:
  - images:
      - ghcr.io/mallardduck/rancher-demo
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: package/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --target=rancher-demo
    labels:
      org.opencontainers.image.title: rancher-demo
      org.opencontainers.image.description: Rancher deployer with k3s
      org.opencontainers.image.url: https://github.com/mallardduck/rancher-deployer
      org.opencontainers.image.source: https://github.com/mallardduck/rancher-deployer
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    sbom: false  # Build provenance is handled by GitHub Actions

changelog:
  use: github
  sort: asc
  groups:
    - title: "New features"
      regexp: '^feat'
    - title: "Bug fixes"
      regexp: '^fix'
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mallardduck
    name: rancher-deployer
  draft: false
  prerelease: auto
