version: 2

project_name: rancher-deployer

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: rancher-deployer
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mallardduck/rancher-deployer/internal/version.Version={{.Version}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Commit={{.Commit}}
      - -X github.com/mallardduck/rancher-deployer/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

dockers:
  - image_templates:
      - "ghcr.io/mallardduck/rancher-demo:{{ .Version }}-amd64"
      - "ghcr.io/mallardduck/rancher-demo:latest-amd64"
    use: buildx
    dockerfile: package/Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--target=rancher-deployer"
      - "--build-arg=TARGETARCH=amd64"
      - "--label=org.opencontainers.image.title=rancher-demo"
      - "--label=org.opencontainers.image.description=Rancher deployer with k3s"
      - "--label=org.opencontainers.image.url=https://github.com/mallardduck/rancher-deployer"
      - "--label=org.opencontainers.image.source=https://github.com/mallardduck/rancher-deployer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: amd64
  - image_templates:
      - "ghcr.io/mallardduck/rancher-demo:{{ .Version }}-arm64"
      - "ghcr.io/mallardduck/rancher-demo:latest-arm64"
    use: buildx
    dockerfile: package/Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--target=rancher-deployer"
      - "--build-arg=TARGETARCH=arm64"
      - "--label=org.opencontainers.image.title=rancher-demo"
      - "--label=org.opencontainers.image.description=Rancher deployer with k3s"
      - "--label=org.opencontainers.image.url=https://github.com/mallardduck/rancher-deployer"
      - "--label=org.opencontainers.image.source=https://github.com/mallardduck/rancher-deployer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/mallardduck/rancher-demo:{{ .Version }}"
    image_templates:
      - "ghcr.io/mallardduck/rancher-demo:{{ .Version }}-amd64"
      - "ghcr.io/mallardduck/rancher-demo:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mallardduck/rancher-demo:latest"
    image_templates:
      - "ghcr.io/mallardduck/rancher-demo:latest-amd64"
      - "ghcr.io/mallardduck/rancher-demo:latest-arm64"

changelog:
  use: github
  sort: asc
  groups:
    - title: "New features"
      regexp: '^feat'
    - title: "Bug fixes"
      regexp: '^fix'
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mallardduck
    name: rancher-deployer
  draft: false
  prerelease: auto
